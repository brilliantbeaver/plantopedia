<svg xmlns="http://www.w3.org/2000/svg" width="980" height="390" viewBox="0 0 980 390" role="img" aria-labelledby="title desc"><title id="title">Components, props, and callbacks</title><desc id="desc">GardenScreen gives props to PageHeader, PlantCard, and SaveButton. SaveButton calls a callback to ask for a change. The owner decides how state changes.</desc><defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#effff8"/><stop offset="1" stop-color="#edf3ff"/></linearGradient>
<linearGradient id="leaf" x2="1" y2="1"><stop stop-color="#37e6b0"/><stop offset="1" stop-color="#07886c"/></linearGradient>
<linearGradient id="glass" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".94"/><stop offset="1" stop-color="#e2efff" stop-opacity=".72"/></linearGradient>
<linearGradient id="violet" x2="1" y2="1"><stop stop-color="#a58cff"/><stop offset="1" stop-color="#6550d9"/></linearGradient>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#426f71" stroke-width="1.4"/></marker>
</defs><g font-family="system-ui,-apple-system,Segoe UI,sans-serif"><rect x="1" y="1" width="978" height="388" rx="26" fill="url(#bg)" stroke="#c8dfd8" stroke-width="1.5"/><text x="32" y="45" font-size="24" fill="#163c3d" font-weight="750" text-anchor="start">Small components make a screen easier to reason about.</text><text x="32" y="74" font-size="16" fill="#163c3d" font-weight="500" text-anchor="start">Data travels down as props. A callback lets a child ask its parent to change something.</text><rect x="343" y="98" width="285" height="105" rx="20" fill="#e7e0ff" stroke="#bbd8d2" stroke-width="1.5"/><text x="360" y="152" font-size="20" fill="#163c3d" font-weight="700" text-anchor="start">GardenScreen</text><text x="360" y="178" font-size="15" fill="#163c3d" font-weight="500" text-anchor="start">Owns the selected specimen</text><rect x="35" y="255" width="260" height="105" rx="20" fill="#d1f7e9" stroke="#bbd8d2" stroke-width="1.5"/><text x="52" y="309" font-size="20" fill="#163c3d" font-weight="700" text-anchor="start">PageHeader</text><text x="52" y="335" font-size="15" fill="#163c3d" font-weight="500" text-anchor="start">title=&quot;My garden&quot;</text><path d="M485 203L165 247" stroke="#426f71" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="325.0" y="213.0" font-size="14" fill="#163c3d" font-weight="500" text-anchor="middle">props</text><rect x="354" y="255" width="260" height="105" rx="20" fill="#d1f7e9" stroke="#bbd8d2" stroke-width="1.5"/><text x="371" y="309" font-size="20" fill="#163c3d" font-weight="700" text-anchor="start">PlantCard</text><text x="371" y="335" font-size="15" fill="#163c3d" font-weight="500" text-anchor="start">plant={fern}</text><path d="M485 203L484 247" stroke="#426f71" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="484.5" y="213.0" font-size="14" fill="#163c3d" font-weight="500" text-anchor="middle">props</text><rect x="673" y="255" width="260" height="105" rx="20" fill="#d1f7e9" stroke="#bbd8d2" stroke-width="1.5"/><text x="690" y="309" font-size="20" fill="#163c3d" font-weight="700" text-anchor="start">SaveButton</text><text x="690" y="335" font-size="15" fill="#163c3d" font-weight="500" text-anchor="start">onPress={save}</text><path d="M485 203L803 247" stroke="#426f71" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="644.0" y="213.0" font-size="14" fill="#163c3d" font-weight="500" text-anchor="middle">props</text><path d="M915 273V126H635" fill="none" stroke="#7351b7" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="740" y="114" font-size="14" fill="#6842ac" font-weight="500" text-anchor="start">callback request</text></g></svg>