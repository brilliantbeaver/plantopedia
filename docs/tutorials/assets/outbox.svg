<svg xmlns="http://www.w3.org/2000/svg" width="980" height="390" viewBox="0 0 980 390" role="img" aria-labelledby="title desc"><title id="title">Durable outbox checkpoints</title><desc id="desc">The native save flow acknowledges plant, observation, and photo stages before completing. A lost acknowledgment triggers retry with a stable operation key. Owner changes and deleted records stop replay.</desc><defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#effff8"/><stop offset="1" stop-color="#edf3ff"/></linearGradient>
<linearGradient id="leaf" x2="1" y2="1"><stop stop-color="#37e6b0"/><stop offset="1" stop-color="#07886c"/></linearGradient>
<linearGradient id="glass" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".94"/><stop offset="1" stop-color="#e2efff" stop-opacity=".72"/></linearGradient>
<linearGradient id="violet" x2="1" y2="1"><stop stop-color="#a58cff"/><stop offset="1" stop-color="#6550d9"/></linearGradient>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#426f71" stroke-width="1.4"/></marker>
</defs><g font-family="system-ui,-apple-system,Segoe UI,sans-serif"><rect x="1" y="1" width="978" height="388" rx="26" fill="url(#bg)" stroke="#c8dfd8" stroke-width="1.5"/><text x="32" y="45" font-size="24" fill="#163c3d" font-weight="750" text-anchor="start">Persist the last acknowledged checkpoint. Retry with the same key.</text><text x="32" y="74" font-size="16" fill="#163c3d" font-weight="500" text-anchor="start">A lost response is uncertain: the server may already have accepted the write.</text><rect x="26" y="126" width="162" height="105" rx="20" fill="#e7e0ff" stroke="#bbd8d2" stroke-width="1.5"/><circle cx="51" cy="151" r="13" fill="#163c3d"/><text x="51" y="156" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="43" y="180" font-size="20" fill="#163c3d" font-weight="700" text-anchor="start">draft</text><text x="43" y="206" font-size="15" fill="#163c3d" font-weight="500" text-anchor="start">Retain device work</text><path d="M190 177L210 177" stroke="#426f71" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="219" y="126" width="162" height="105" rx="20" fill="#d1f7e9" stroke="#bbd8d2" stroke-width="1.5"/><circle cx="244" cy="151" r="13" fill="#163c3d"/><text x="244" y="156" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="236" y="180" font-size="20" fill="#163c3d" font-weight="700" text-anchor="start">plant</text><text x="236" y="206" font-size="15" fill="#163c3d" font-weight="500" text-anchor="start">Record saved</text><path d="M383 177L403 177" stroke="#426f71" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="412" y="126" width="162" height="105" rx="20" fill="#d1f7e9" stroke="#bbd8d2" stroke-width="1.5"/><circle cx="437" cy="151" r="13" fill="#163c3d"/><text x="437" y="156" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="429" y="180" font-size="20" fill="#163c3d" font-weight="700" text-anchor="start">observation</text><text x="429" y="206" font-size="15" fill="#163c3d" font-weight="500" text-anchor="start">Note saved</text><path d="M576 177L596 177" stroke="#426f71" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="605" y="126" width="162" height="105" rx="20" fill="#d1f7e9" stroke="#bbd8d2" stroke-width="1.5"/><circle cx="630" cy="151" r="13" fill="#163c3d"/><text x="630" y="156" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="622" y="180" font-size="20" fill="#163c3d" font-weight="700" text-anchor="start">photo</text><text x="622" y="206" font-size="15" fill="#163c3d" font-weight="500" text-anchor="start">Image saved</text><path d="M769 177L789 177" stroke="#426f71" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="798" y="126" width="162" height="105" rx="20" fill="#d1f7e9" stroke="#bbd8d2" stroke-width="1.5"/><circle cx="823" cy="151" r="13" fill="#163c3d"/><text x="823" y="156" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">5</text><text x="815" y="180" font-size="20" fill="#163c3d" font-weight="700" text-anchor="start">complete</text><text x="815" y="206" font-size="15" fill="#163c3d" font-weight="500" text-anchor="start">Sync finished</text><path d="M570 240V288H380V239" fill="none" stroke="#9e6044" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="490" y="317" font-size="17" fill="#163c3d" font-weight="500" text-anchor="middle">No acknowledgment? Retry the same operation key.</text><text x="490" y="348" font-size="16" fill="#163c3d" font-weight="500" text-anchor="middle">A changed account or a deleted record must stop the retry.</text></g></svg>