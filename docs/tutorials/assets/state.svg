<svg xmlns="http://www.w3.org/2000/svg" width="980" height="390" viewBox="0 0 980 390" role="img" aria-labelledby="title desc"><title id="title">State snapshots and queued updates</title><desc id="desc">A render sees count zero. Two functional updater calls queue increments, React applies them to obtain two, and the next render displays two. Derive filtered data from the original list.</desc><defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#effff8"/><stop offset="1" stop-color="#edf3ff"/></linearGradient>
<linearGradient id="leaf" x2="1" y2="1"><stop stop-color="#37e6b0"/><stop offset="1" stop-color="#07886c"/></linearGradient>
<linearGradient id="glass" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".94"/><stop offset="1" stop-color="#e2efff" stop-opacity=".72"/></linearGradient>
<linearGradient id="violet" x2="1" y2="1"><stop stop-color="#a58cff"/><stop offset="1" stop-color="#6550d9"/></linearGradient>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#426f71" stroke-width="1.4"/></marker>
</defs><g font-family="system-ui,-apple-system,Segoe UI,sans-serif"><rect x="1" y="1" width="978" height="388" rx="26" fill="url(#bg)" stroke="#c8dfd8" stroke-width="1.5"/><text x="32" y="45" font-size="24" fill="#163c3d" font-weight="750" text-anchor="start">A state update asks React for a new render.</text><text x="32" y="74" font-size="16" fill="#163c3d" font-weight="500" text-anchor="start">Each render sees a snapshot. A functional updater receives the latest queued value.</text><rect x="32" y="137" width="182" height="105" rx="20" fill="#d1f7e9" stroke="#bbd8d2" stroke-width="1.5"/><circle cx="57" cy="162" r="13" fill="#163c3d"/><text x="57" y="167" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="49" y="191" font-size="20" fill="#163c3d" font-weight="700" text-anchor="start">Render</text><text x="49" y="217" font-size="15" fill="#163c3d" font-weight="500" text-anchor="start">count is 0</text><rect x="277" y="137" width="182" height="105" rx="20" fill="#e7e0ff" stroke="#bbd8d2" stroke-width="1.5"/><circle cx="302" cy="162" r="13" fill="#163c3d"/><text x="302" y="167" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="294" y="191" font-size="20" fill="#163c3d" font-weight="700" text-anchor="start">One event</text><text x="294" y="217" font-size="15" fill="#163c3d" font-weight="500" text-anchor="start">queue 2 updaters</text><rect x="522" y="137" width="182" height="105" rx="20" fill="#ffe2ad" stroke="#bbd8d2" stroke-width="1.5"/><circle cx="547" cy="162" r="13" fill="#163c3d"/><text x="547" y="167" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="539" y="191" font-size="20" fill="#163c3d" font-weight="700" text-anchor="start">Apply updates</text><text x="539" y="217" font-size="15" fill="#163c3d" font-weight="500" text-anchor="start">0 → 1 → 2</text><rect x="767" y="137" width="182" height="105" rx="20" fill="#d1f7e9" stroke="#bbd8d2" stroke-width="1.5"/><circle cx="792" cy="162" r="13" fill="#163c3d"/><text x="792" y="167" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="784" y="191" font-size="20" fill="#163c3d" font-weight="700" text-anchor="start">Render again</text><text x="784" y="217" font-size="15" fill="#163c3d" font-weight="500" text-anchor="start">count is now 2</text><path d="M214 190L268 190" stroke="#426f71" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M459 190L513 190" stroke="#426f71" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M704 190L758 190" stroke="#426f71" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="35" y="277" width="907" height="65" rx="20" fill="#fff" stroke="#bbd8d2" stroke-width="1.5"/><text x="56" y="305" font-size="18" fill="#163c3d" font-weight="700" text-anchor="start">Keep one source of truth.</text><text x="56" y="329" font-size="16" fill="#163c3d" font-weight="500" text-anchor="start">Derive filtered plants from plants + search text; do not store a second copy of the result.</text></g></svg>