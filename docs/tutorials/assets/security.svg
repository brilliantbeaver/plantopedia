<svg xmlns="http://www.w3.org/2000/svg" width="980" height="390" viewBox="0 0 980 390" role="img" aria-labelledby="title desc"><title id="title">Client and server trust boundary</title><desc id="desc">The Expo app sends an authentication token to the API. The API verifies identity and ownership before reading private storage. A client query key is not authorization.</desc><defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#effff8"/><stop offset="1" stop-color="#edf3ff"/></linearGradient>
<linearGradient id="leaf" x2="1" y2="1"><stop stop-color="#37e6b0"/><stop offset="1" stop-color="#07886c"/></linearGradient>
<linearGradient id="glass" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".94"/><stop offset="1" stop-color="#e2efff" stop-opacity=".72"/></linearGradient>
<linearGradient id="violet" x2="1" y2="1"><stop stop-color="#a58cff"/><stop offset="1" stop-color="#6550d9"/></linearGradient>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#426f71" stroke-width="1.4"/></marker>
</defs><g font-family="system-ui,-apple-system,Segoe UI,sans-serif"><rect x="1" y="1" width="978" height="388" rx="26" fill="url(#bg)" stroke="#c8dfd8" stroke-width="1.5"/><text x="32" y="45" font-size="24" fill="#163c3d" font-weight="750" text-anchor="start">The phone asks. The server decides what it may access.</text><text x="32" y="74" font-size="16" fill="#163c3d" font-weight="500" text-anchor="start">Public configuration is bundled into the app; provider credentials stay on the server.</text><rect x="35" y="146" width="242" height="105" rx="20" fill="#d1f7e9" stroke="#bbd8d2" stroke-width="1.5"/><circle cx="60" cy="171" r="13" fill="#163c3d"/><text x="60" y="176" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="52" y="200" font-size="20" fill="#163c3d" font-weight="700" text-anchor="start">Expo app</text><text x="52" y="226" font-size="15" fill="#163c3d" font-weight="500" text-anchor="start">Public API URL + Clerk key</text><path d="M280 198L370 198" stroke="#426f71" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="325.0" y="186.0" font-size="14" fill="#163c3d" font-weight="500" text-anchor="middle">Bearer token</text><rect x="375" y="146" width="247" height="105" rx="20" fill="#e7e0ff" stroke="#bbd8d2" stroke-width="1.5"/><circle cx="400" cy="171" r="13" fill="#163c3d"/><text x="400" y="176" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="392" y="200" font-size="20" fill="#163c3d" font-weight="700" text-anchor="start">API trust boundary</text><text x="392" y="226" font-size="15" fill="#163c3d" font-weight="500" text-anchor="start">Verify identity + ownership</text><path d="M625 198L713 198" stroke="#426f71" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="669.0" y="186.0" font-size="14" fill="#163c3d" font-weight="500" text-anchor="middle">authorized</text><rect x="719" y="146" width="227" height="105" rx="20" fill="#d1f7e9" stroke="#bbd8d2" stroke-width="1.5"/><circle cx="744" cy="171" r="13" fill="#163c3d"/><text x="744" y="176" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="736" y="200" font-size="20" fill="#163c3d" font-weight="700" text-anchor="start">Private storage</text><text x="736" y="226" font-size="15" fill="#163c3d" font-weight="500" text-anchor="start">Owner-scoped records</text><path d="M350 100V314" stroke="#b85c43" stroke-width="2" stroke-dasharray="7 6"/><text x="352" y="341" font-size="17" fill="#163c3d" font-weight="500" text-anchor="middle">No server secret crosses this boundary into the app bundle.</text></g></svg>