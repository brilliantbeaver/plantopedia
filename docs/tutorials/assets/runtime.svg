<svg xmlns="http://www.w3.org/2000/svg" width="980" height="390" viewBox="0 0 980 390" role="img" aria-labelledby="title desc"><title id="title">React Native render targets</title><desc id="desc">A TypeScript component is described once. React Native renders native views on iOS and Android. React Native Web renders DOM in a browser. Expo Go includes a fixed set of native modules.</desc><defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#effff8"/><stop offset="1" stop-color="#edf3ff"/></linearGradient>
<linearGradient id="leaf" x2="1" y2="1"><stop stop-color="#37e6b0"/><stop offset="1" stop-color="#07886c"/></linearGradient>
<linearGradient id="glass" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".94"/><stop offset="1" stop-color="#e2efff" stop-opacity=".72"/></linearGradient>
<linearGradient id="violet" x2="1" y2="1"><stop stop-color="#a58cff"/><stop offset="1" stop-color="#6550d9"/></linearGradient>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#426f71" stroke-width="1.4"/></marker>
</defs><g font-family="system-ui,-apple-system,Segoe UI,sans-serif"><rect x="1" y="1" width="978" height="388" rx="26" fill="url(#bg)" stroke="#c8dfd8" stroke-width="1.5"/><text x="32" y="45" font-size="24" fill="#163c3d" font-weight="750" text-anchor="start">One component description. Three render targets.</text><text x="32" y="74" font-size="16" fill="#163c3d" font-weight="500" text-anchor="start">Expo supplies tools and native modules; React Native turns the description into platform views.</text><rect x="35" y="146" width="210" height="105" rx="20" fill="#d1f7e9" stroke="#bbd8d2" stroke-width="1.5"/><circle cx="60" cy="171" r="13" fill="#163c3d"/><text x="60" y="176" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="52" y="200" font-size="20" fill="#163c3d" font-weight="700" text-anchor="start">PlantCard.tsx</text><text x="52" y="226" font-size="15" fill="#163c3d" font-weight="500" text-anchor="start">Props + state → JSX</text><path d="M245 198L337 198" stroke="#426f71" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="291.0" y="186.0" font-size="14" fill="#163c3d" font-weight="500" text-anchor="middle">render</text><rect x="340" y="146" width="230" height="105" rx="20" fill="#e7e0ff" stroke="#bbd8d2" stroke-width="1.5"/><circle cx="365" cy="171" r="13" fill="#163c3d"/><text x="365" y="176" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="357" y="200" font-size="20" fill="#163c3d" font-weight="700" text-anchor="start">React Native</text><text x="357" y="226" font-size="15" fill="#163c3d" font-weight="500" text-anchor="start">Shared component model</text><rect x="727" y="86" width="215" height="63" rx="20" fill="#fff" stroke="#bbd8d2" stroke-width="1.5"/><text x="744" y="112" font-size="19" fill="#163c3d" font-weight="700" text-anchor="start">iOS</text><text x="744" y="133" font-size="14" fill="#163c3d" font-weight="500" text-anchor="start">Native views</text><path d="M570 198H640V116H720" fill="none" stroke="#426f71" stroke-width="2" marker-end="url(#arrow)"/><rect x="727" y="173" width="215" height="63" rx="20" fill="#fff" stroke="#bbd8d2" stroke-width="1.5"/><text x="744" y="199" font-size="19" fill="#163c3d" font-weight="700" text-anchor="start">Android</text><text x="744" y="220" font-size="14" fill="#163c3d" font-weight="500" text-anchor="start">Native views</text><path d="M570 198H640V203H720" fill="none" stroke="#426f71" stroke-width="2" marker-end="url(#arrow)"/><rect x="727" y="260" width="215" height="63" rx="20" fill="#fff" stroke="#bbd8d2" stroke-width="1.5"/><text x="744" y="286" font-size="19" fill="#163c3d" font-weight="700" text-anchor="start">Web</text><text x="744" y="307" font-size="14" fill="#163c3d" font-weight="500" text-anchor="start">DOM via RN Web</text><path d="M570 198H640V290H720" fill="none" stroke="#426f71" stroke-width="2" marker-end="url(#arrow)"/></g></svg>