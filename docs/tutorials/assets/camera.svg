<svg xmlns="http://www.w3.org/2000/svg" width="980" height="390" viewBox="0 0 980 390" role="img" aria-labelledby="title desc"><title id="title">Camera permission, readiness, and retention</title><desc id="desc">A permission request is followed by a ready camera, retention of the original, and preparation of a separate upload derivative. Denied permission can lead to choosing a library photo.</desc><defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#effff8"/><stop offset="1" stop-color="#edf3ff"/></linearGradient>
<linearGradient id="leaf" x2="1" y2="1"><stop stop-color="#37e6b0"/><stop offset="1" stop-color="#07886c"/></linearGradient>
<linearGradient id="glass" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".94"/><stop offset="1" stop-color="#e2efff" stop-opacity=".72"/></linearGradient>
<linearGradient id="violet" x2="1" y2="1"><stop stop-color="#a58cff"/><stop offset="1" stop-color="#6550d9"/></linearGradient>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#426f71" stroke-width="1.4"/></marker>
</defs><g font-family="system-ui,-apple-system,Segoe UI,sans-serif"><rect x="1" y="1" width="978" height="388" rx="26" fill="url(#bg)" stroke="#c8dfd8" stroke-width="1.5"/><text x="32" y="45" font-size="24" fill="#163c3d" font-weight="750" text-anchor="start">A photograph moves through several different states.</text><text x="32" y="74" font-size="16" fill="#163c3d" font-weight="500" text-anchor="start">Permission allows access. Camera readiness allows a shot. A saved original allows recovery.</text><rect x="30" y="137" width="180" height="105" rx="20" fill="#e7e0ff" stroke="#bbd8d2" stroke-width="1.5"/><circle cx="55" cy="162" r="13" fill="#163c3d"/><text x="55" y="167" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="47" y="191" font-size="20" fill="#163c3d" font-weight="700" text-anchor="start">Permission</text><text x="47" y="217" font-size="15" fill="#163c3d" font-weight="500" text-anchor="start">request on user intent</text><rect x="277" y="137" width="180" height="105" rx="20" fill="#d1f7e9" stroke="#bbd8d2" stroke-width="1.5"/><circle cx="302" cy="162" r="13" fill="#163c3d"/><text x="302" y="167" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="294" y="191" font-size="20" fill="#163c3d" font-weight="700" text-anchor="start">Ready camera</text><text x="294" y="217" font-size="15" fill="#163c3d" font-weight="500" text-anchor="start">onCameraReady</text><rect x="524" y="137" width="180" height="105" rx="20" fill="#ffe2ad" stroke="#bbd8d2" stroke-width="1.5"/><circle cx="549" cy="162" r="13" fill="#163c3d"/><text x="549" y="167" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="541" y="191" font-size="20" fill="#163c3d" font-weight="700" text-anchor="start">Retain original</text><text x="541" y="217" font-size="15" fill="#163c3d" font-weight="500" text-anchor="start">durable device copy</text><rect x="771" y="137" width="180" height="105" rx="20" fill="#d1f7e9" stroke="#bbd8d2" stroke-width="1.5"/><circle cx="796" cy="162" r="13" fill="#163c3d"/><text x="796" y="167" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="788" y="191" font-size="20" fill="#163c3d" font-weight="700" text-anchor="start">Prepare copy</text><text x="788" y="217" font-size="15" fill="#163c3d" font-weight="500" text-anchor="start">upright + clean JPEG</text><path d="M211 189L267 189" stroke="#426f71" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M458 189L514 189" stroke="#426f71" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M705 189L761 189" stroke="#426f71" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="35" y="278" width="907" height="65" rx="20" fill="#fff" stroke="#bbd8d2" stroke-width="1.5"/><text x="55" y="306" font-size="18" fill="#163c3d" font-weight="700" text-anchor="start">Denied permission is a supported state.</text><text x="55" y="331" font-size="16" fill="#163c3d" font-weight="500" text-anchor="start">Offer the photo library. Saving a specimen does not require a successful identification.</text></g></svg>