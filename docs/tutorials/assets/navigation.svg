<svg xmlns="http://www.w3.org/2000/svg" width="980" height="390" viewBox="0 0 980 390" role="img" aria-labelledby="title desc"><title id="title">Files, URLs, and specimen identity</title><desc id="desc">The tabs route group is omitted from URLs. plants/[plantId].tsx receives a stable specimen ID. Two ferns have different paths and histories even if they share a scientific name.</desc><defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#effff8"/><stop offset="1" stop-color="#edf3ff"/></linearGradient>
<linearGradient id="leaf" x2="1" y2="1"><stop stop-color="#37e6b0"/><stop offset="1" stop-color="#07886c"/></linearGradient>
<linearGradient id="glass" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".94"/><stop offset="1" stop-color="#e2efff" stop-opacity=".72"/></linearGradient>
<linearGradient id="violet" x2="1" y2="1"><stop stop-color="#a58cff"/><stop offset="1" stop-color="#6550d9"/></linearGradient>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#426f71" stroke-width="1.4"/></marker>
</defs><g font-family="system-ui,-apple-system,Segoe UI,sans-serif"><rect x="1" y="1" width="978" height="388" rx="26" fill="url(#bg)" stroke="#c8dfd8" stroke-width="1.5"/><text x="32" y="45" font-size="24" fill="#163c3d" font-weight="750" text-anchor="start">The route identifies a specimen, not a species.</text><text x="32" y="74" font-size="16" fill="#163c3d" font-weight="500" text-anchor="start">A route group organizes the files without adding a segment to the URL.</text><rect x="35" y="109" width="410" height="229" rx="20" fill="#fff" stroke="#bbd8d2" stroke-width="1.5"/><text x="55" y="143" font-size="20" fill="#163c3d" font-weight="700" text-anchor="start">src/app/</text><text x="55" y="180" font-size="17" fill="#163c3d" font-weight="500" text-anchor="start">(tabs)/_layout.tsx  →  tab shell</text><text x="55" y="217" font-size="17" fill="#163c3d" font-weight="500" text-anchor="start">(tabs)/plants.tsx  →  /plants</text><text x="55" y="254" font-size="17" fill="#163c3d" font-weight="500" text-anchor="start">plants/[plantId].tsx</text><text x="55" y="291" font-size="17" fill="#163c3d" font-weight="500" text-anchor="start">[plantId] reads the selected ID</text><path d="M447 224L526 224" stroke="#426f71" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="486.5" y="212.0" font-size="14" fill="#163c3d" font-weight="500" text-anchor="middle">push</text><rect x="550" y="111" width="383" height="105" rx="20" fill="#d1f7e9" stroke="#bbd8d2" stroke-width="1.5"/><text x="567" y="165" font-size="20" fill="#163c3d" font-weight="700" text-anchor="start">/plants/fern_kitchen</text><text x="567" y="191" font-size="15" fill="#163c3d" font-weight="500" text-anchor="start">The fern beside your kitchen window</text><rect x="550" y="245" width="383" height="105" rx="20" fill="#e7e0ff" stroke="#bbd8d2" stroke-width="1.5"/><text x="567" y="299" font-size="20" fill="#163c3d" font-weight="700" text-anchor="start">/plants/fern_patio</text><text x="567" y="325" font-size="15" fill="#163c3d" font-weight="500" text-anchor="start">A different fern, with its own history</text></g></svg>