<svg xmlns="http://www.w3.org/2000/svg" width="980" height="390" viewBox="0 0 980 390" role="img" aria-labelledby="title desc"><title id="title">Voice session lifecycle</title><desc id="desc">Idle transitions to connection, then listening and speaking. Ending cleans up audio, sockets and timers before returning to idle. Late callbacks must not update a new session.</desc><defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#effff8"/><stop offset="1" stop-color="#edf3ff"/></linearGradient>
<linearGradient id="leaf" x2="1" y2="1"><stop stop-color="#37e6b0"/><stop offset="1" stop-color="#07886c"/></linearGradient>
<linearGradient id="glass" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".94"/><stop offset="1" stop-color="#e2efff" stop-opacity=".72"/></linearGradient>
<linearGradient id="violet" x2="1" y2="1"><stop stop-color="#a58cff"/><stop offset="1" stop-color="#6550d9"/></linearGradient>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#426f71" stroke-width="1.4"/></marker>
</defs><g font-family="system-ui,-apple-system,Segoe UI,sans-serif"><rect x="1" y="1" width="978" height="388" rx="26" fill="url(#bg)" stroke="#c8dfd8" stroke-width="1.5"/><text x="32" y="45" font-size="24" fill="#163c3d" font-weight="750" text-anchor="start">A voice session owns resources until it ends.</text><text x="32" y="74" font-size="16" fill="#163c3d" font-weight="500" text-anchor="start">Starting a new generation prevents old callbacks from changing the next session.</text><rect x="30" y="137" width="180" height="105" rx="20" fill="#d1f7e9" stroke="#bbd8d2" stroke-width="1.5"/><circle cx="55" cy="162" r="13" fill="#163c3d"/><text x="55" y="167" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="47" y="191" font-size="20" fill="#163c3d" font-weight="700" text-anchor="start">Idle</text><text x="47" y="217" font-size="15" fill="#163c3d" font-weight="500" text-anchor="start">No microphone</text><rect x="277" y="137" width="180" height="105" rx="20" fill="#e7e0ff" stroke="#bbd8d2" stroke-width="1.5"/><circle cx="302" cy="162" r="13" fill="#163c3d"/><text x="302" y="167" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="294" y="191" font-size="20" fill="#163c3d" font-weight="700" text-anchor="start">Connect</text><text x="294" y="217" font-size="15" fill="#163c3d" font-weight="500" text-anchor="start">Token + socket</text><rect x="524" y="137" width="180" height="105" rx="20" fill="#ffe2ad" stroke="#bbd8d2" stroke-width="1.5"/><circle cx="549" cy="162" r="13" fill="#163c3d"/><text x="549" y="167" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="541" y="191" font-size="20" fill="#163c3d" font-weight="700" text-anchor="start">Listen / speak</text><text x="541" y="217" font-size="15" fill="#163c3d" font-weight="500" text-anchor="start">Audio queue + captions</text><rect x="771" y="137" width="180" height="105" rx="20" fill="#d1f7e9" stroke="#bbd8d2" stroke-width="1.5"/><circle cx="796" cy="162" r="13" fill="#163c3d"/><text x="796" y="167" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="788" y="191" font-size="20" fill="#163c3d" font-weight="700" text-anchor="start">End / cleanup</text><text x="788" y="217" font-size="15" fill="#163c3d" font-weight="500" text-anchor="start">Stop, close, clear</text><path d="M211 189L267 189" stroke="#426f71" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M458 189L514 189" stroke="#426f71" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M705 189L761 189" stroke="#426f71" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M857 243V311H119V243" fill="none" stroke="#426f71" stroke-width="2" marker-end="url(#arrow)"/><text x="490" y="332" font-size="15" fill="#163c3d" font-weight="500" text-anchor="middle">End, background, route blur, error, or account change → full cleanup.</text><text x="490" y="359" font-size="15" fill="#163c3d" font-weight="500" text-anchor="middle">Interrupting a reply clears playback and returns to listening.</text></g></svg>