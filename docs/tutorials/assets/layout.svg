<svg xmlns="http://www.w3.org/2000/svg" width="980" height="390" viewBox="0 0 980 390" role="img" aria-labelledby="title desc"><title id="title">Flexbox main axes</title><desc id="desc">Two containers compare a column with a vertical main axis and a row with a horizontal main axis. Three children retain their order. A narrow screen still needs readable text.</desc><defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#effff8"/><stop offset="1" stop-color="#edf3ff"/></linearGradient>
<linearGradient id="leaf" x2="1" y2="1"><stop stop-color="#37e6b0"/><stop offset="1" stop-color="#07886c"/></linearGradient>
<linearGradient id="glass" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".94"/><stop offset="1" stop-color="#e2efff" stop-opacity=".72"/></linearGradient>
<linearGradient id="violet" x2="1" y2="1"><stop stop-color="#a58cff"/><stop offset="1" stop-color="#6550d9"/></linearGradient>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#426f71" stroke-width="1.4"/></marker>
</defs><g font-family="system-ui,-apple-system,Segoe UI,sans-serif"><rect x="1" y="1" width="978" height="388" rx="26" fill="url(#bg)" stroke="#c8dfd8" stroke-width="1.5"/><text x="32" y="45" font-size="24" fill="#163c3d" font-weight="750" text-anchor="start">The main axis follows flexDirection.</text><text x="32" y="74" font-size="16" fill="#163c3d" font-weight="500" text-anchor="start">React Native defaults to column. Gap separates siblings; padding separates content from the edge.</text><rect x="35" y="109" width="430" height="228" rx="20" fill="#fff" stroke="#bbd8d2" stroke-width="1.5"/><text x="53" y="140" font-size="20" fill="#163c3d" font-weight="700" text-anchor="start">flexDirection: column</text><rect x="103" y="158" width="235" height="34" rx="9" fill="#a7eed5" stroke="#bbd8d2" stroke-width="1.5"/><text x="120" y="181" font-size="16" fill="#163c3d" font-weight="500" text-anchor="start">Child 1</text><rect x="103" y="206" width="235" height="34" rx="9" fill="#c8beff" stroke="#bbd8d2" stroke-width="1.5"/><text x="120" y="229" font-size="16" fill="#163c3d" font-weight="500" text-anchor="start">Child 2</text><rect x="103" y="254" width="235" height="34" rx="9" fill="#ffd28d" stroke="#bbd8d2" stroke-width="1.5"/><text x="120" y="277" font-size="16" fill="#163c3d" font-weight="500" text-anchor="start">Child 3</text><path d="M69 164L69 305" stroke="#426f71" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="365" y="222" font-size="15" fill="#163c3d" font-weight="500" text-anchor="start">main</text><text x="365" y="245" font-size="15" fill="#163c3d" font-weight="500" text-anchor="start">axis ↓</text><rect x="510" y="109" width="430" height="228" rx="20" fill="#fff" stroke="#bbd8d2" stroke-width="1.5"/><text x="528" y="140" font-size="20" fill="#163c3d" font-weight="700" text-anchor="start">flexDirection: row</text><rect x="535" y="179" width="110" height="94" rx="12" fill="#a7eed5" stroke="#bbd8d2" stroke-width="1.5"/><text x="590" y="232" font-size="16" fill="#163c3d" font-weight="500" text-anchor="middle">Child 1</text><rect x="665" y="179" width="110" height="94" rx="12" fill="#c8beff" stroke="#bbd8d2" stroke-width="1.5"/><text x="720" y="232" font-size="16" fill="#163c3d" font-weight="500" text-anchor="middle">Child 2</text><rect x="795" y="179" width="110" height="94" rx="12" fill="#ffd28d" stroke="#bbd8d2" stroke-width="1.5"/><text x="850" y="232" font-size="16" fill="#163c3d" font-weight="500" text-anchor="middle">Child 3</text><path d="M542 304L900 304" stroke="#426f71" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="721.0" y="292.0" font-size="14" fill="#163c3d" font-weight="500" text-anchor="middle">main axis →</text><text x="35" y="368" font-size="16" fill="#163c3d" font-weight="500" text-anchor="start">Try the layout lab: change direction, gap, and width. Check the long plant name.</text></g></svg>