<svg xmlns="http://www.w3.org/2000/svg" width="980" height="390" viewBox="0 0 980 390" role="img" aria-labelledby="title desc"><title id="title">Layers of evidence for a release</title><desc id="desc">Types and pure logic checks form a wide foundation. Component and API tests cover visible outcomes and transport behavior. Real devices verify permissions, camera, audio, and large text.</desc><defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#effff8"/><stop offset="1" stop-color="#edf3ff"/></linearGradient>
<linearGradient id="leaf" x2="1" y2="1"><stop stop-color="#37e6b0"/><stop offset="1" stop-color="#07886c"/></linearGradient>
<linearGradient id="glass" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".94"/><stop offset="1" stop-color="#e2efff" stop-opacity=".72"/></linearGradient>
<linearGradient id="violet" x2="1" y2="1"><stop stop-color="#a58cff"/><stop offset="1" stop-color="#6550d9"/></linearGradient>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#426f71" stroke-width="1.4"/></marker>
</defs><g font-family="system-ui,-apple-system,Segoe UI,sans-serif"><rect x="1" y="1" width="978" height="388" rx="26" fill="url(#bg)" stroke="#c8dfd8" stroke-width="1.5"/><text x="32" y="45" font-size="24" fill="#163c3d" font-weight="750" text-anchor="start">Different checks answer different questions.</text><text x="32" y="74" font-size="16" fill="#163c3d" font-weight="500" text-anchor="start">A green JavaScript test cannot prove that a real microphone, camera, or app-store build works.</text><rect x="260" y="115" width="460" height="61" rx="20" fill="#e7e0ff" stroke="#bbd8d2" stroke-width="1.5"/><text x="490.0" y="140" font-size="19" fill="#163c3d" font-weight="700" text-anchor="middle">Real-device acceptance</text><text x="490.0" y="163" font-size="15" fill="#163c3d" font-weight="500" text-anchor="middle">Permissions · camera · audio · large text</text><rect x="172" y="187" width="636" height="61" rx="20" fill="#c7f1e8" stroke="#bbd8d2" stroke-width="1.5"/><text x="490.0" y="212" font-size="19" fill="#163c3d" font-weight="700" text-anchor="middle">Component and API tests</text><text x="490.0" y="235" font-size="15" fill="#163c3d" font-weight="500" text-anchor="middle">Visible outcomes · auth · retries · failures</text><rect x="70" y="259" width="840" height="61" rx="20" fill="#d8e9ff" stroke="#bbd8d2" stroke-width="1.5"/><text x="490.0" y="284" font-size="19" fill="#163c3d" font-weight="700" text-anchor="middle">Types and pure-logic tests</text><text x="490.0" y="307" font-size="15" fill="#163c3d" font-weight="500" text-anchor="middle">Contracts · immutable state · sequence transitions</text><text x="490" y="357" font-size="17" fill="#163c3d" font-weight="500" text-anchor="middle">Release only after the platform-specific evidence is recorded.</text></g></svg>