<svg xmlns="http://www.w3.org/2000/svg" width="500" height="420" viewBox="0 0 500 420" role="img" aria-labelledby="title desc"><title id="title">Grow a cross-platform plant companion</title><desc id="desc">An original vector illustration of a leafy fern beside an Expo-style phone showing a saved plant card. Learn progressively across iOS, Android, and web.</desc><defs>
