<svg xmlns="http://www.w3.org/2000/svg" width="980" height="390" viewBox="0 0 980 390" role="img" aria-labelledby="title desc"><title id="title">Request status and runtime validation</title><desc id="desc">After a request, check HTTP success and then validate the response body. Either check can lead to an error state. Successful empty data is different from a failure.</desc><defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#effff8"/><stop offset="1" stop-color="#edf3ff"/></linearGradient>
<linearGradient id="leaf" x2="1" y2="1"><stop stop-color="#37e6b0"/><stop offset="1" stop-color="#07886c"/></linearGradient>
<linearGradient id="glass" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".94"/><stop offset="1" stop-color="#e2efff" stop-opacity=".72"/></linearGradient>
<linearGradient id="violet" x2="1" y2="1"><stop stop-color="#a58cff"/><stop offset="1" stop-color="#6550d9"/></linearGradient>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#426f71" stroke-width="1.4"/></marker>
</defs><g font-family="system-ui,-apple-system,Segoe UI,sans-serif"><rect x="1" y="1" width="978" height="388" rx="26" fill="url(#bg)" stroke="#c8dfd8" stroke-width="1.5"/><text x="32" y="45" font-size="24" fill="#163c3d" font-weight="750" text-anchor="start">A response has to pass two checks before it becomes data.</text><text x="32" y="74" font-size="16" fill="#163c3d" font-weight="500" text-anchor="start">A completed HTTP request can still contain an error status or an unexpected JSON shape.</text><rect x="30" y="126" width="180" height="105" rx="20" fill="#d1f7e9" stroke="#bbd8d2" stroke-width="1.5"/><circle cx="55" cy="151" r="13" fill="#163c3d"/><text x="55" y="156" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="47" y="180" font-size="20" fill="#163c3d" font-weight="700" text-anchor="start">Request</text><text x="47" y="206" font-size="15" fill="#163c3d" font-weight="500" text-anchor="start">owner + token</text><rect x="277" y="126" width="180" height="105" rx="20" fill="#e7e0ff" stroke="#bbd8d2" stroke-width="1.5"/><circle cx="302" cy="151" r="13" fill="#163c3d"/><text x="302" y="156" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="294" y="180" font-size="20" fill="#163c3d" font-weight="700" text-anchor="start">HTTP status</text><text x="294" y="206" font-size="15" fill="#163c3d" font-weight="500" text-anchor="start">response.ok?</text><rect x="524" y="126" width="180" height="105" rx="20" fill="#ffe2ad" stroke="#bbd8d2" stroke-width="1.5"/><circle cx="549" cy="151" r="13" fill="#163c3d"/><text x="549" y="156" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="541" y="180" font-size="20" fill="#163c3d" font-weight="700" text-anchor="start">JSON shape</text><text x="541" y="206" font-size="15" fill="#163c3d" font-weight="500" text-anchor="start">schema.parse(json)</text><rect x="771" y="126" width="180" height="105" rx="20" fill="#d1f7e9" stroke="#bbd8d2" stroke-width="1.5"/><circle cx="796" cy="151" r="13" fill="#163c3d"/><text x="796" y="156" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="788" y="180" font-size="20" fill="#163c3d" font-weight="700" text-anchor="start">Render</text><text x="788" y="206" font-size="15" fill="#163c3d" font-weight="500" text-anchor="start">data or empty</text><path d="M211 179L267 179" stroke="#426f71" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M458 179L514 179" stroke="#426f71" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M705 179L761 179" stroke="#426f71" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M367 232L367 287" stroke="#426f71" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M614 232L614 287" stroke="#426f71" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="258" y="291" width="470" height="62" rx="20" fill="#ffe9e1" stroke="#e4b6ab" stroke-width="1.5"/><text x="493" y="317" font-size="17" fill="#163c3d" font-weight="650" text-anchor="middle">Error state: explain, preserve work, offer retry</text><text x="493" y="340" font-size="15" fill="#163c3d" font-weight="500" text-anchor="middle">Loading, empty, success, and error are distinct.</text></g></svg>