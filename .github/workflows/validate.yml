name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm install --global npm@12.0.2
      - run: npm ci --include=dev
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Audit deployed API dependencies
        run: npm audit --workspace @plantopedia/server --omit=dev
      - name: Build complete Vercel output from a fresh checkout
        run: npm run build:vercel
        env:
          # Public, nonfunctional fixtures: CI compiles assets without credentials.
          CLERK_PUBLISHABLE_KEY: pk_live_Zml4dHVyZS5jbGVyay5leGFtcGxlLmludmFsaWQk
          CLERK_PROXY_URL: https://fixture.example.invalid/__clerk
      - name: Check all platform bundles for private configuration
        run: npm run test:bundle-secrets
